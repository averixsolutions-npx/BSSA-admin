name: Admin E2E Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  ADMIN_PASSWORD: ci-admin-password
  ADMIN_USERNAME: admin
  NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout admin repo
        uses: actions/checkout@v4

      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          repository: <your-org>/nwsf
          path: backend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── Backend setup ──
      - name: Install backend deps
        working-directory: backend/apps/api
        run: npm install

      - name: Create backend .env
        working-directory: backend/apps/api
        run: |
          cat > .env <<'EOF'
          NODE_ENV=development
          PORT=4000
          LOG_LEVEL=warn
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres
          DIRECT_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres
          JWT_ACCESS_SECRET=${{ secrets.CI_JWT_ACCESS }}
          JWT_REFRESH_SECRET=${{ secrets.CI_JWT_REFRESH }}
          SMS_PROVIDER=devbypass
          ALLOWED_ORIGINS=http://localhost:3001
          ADMIN_SEED_USERNAME=admin
          ADMIN_SEED_PASSWORD=ci-admin-password
          EOF

      - name: Backend migrate + seed
        working-directory: backend/apps/api
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run seed

      - name: Start backend
        working-directory: backend/apps/api
        run: |
          npm run build
          nohup npm start &
          sleep 5
          curl -f http://localhost:4000/health

      # ── Admin setup ──
      - name: Install admin deps
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build admin
        run: npm run build

      - name: Start admin
        run: |
          nohup npm start &
          sleep 5
          curl -f http://localhost:3001/login || echo "Admin not responding yet, retrying..." && sleep 5

      # ── Run tests ──
      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
